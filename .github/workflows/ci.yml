# CI gates for the Koinos EVM engine + JSON-RPC proxy.
#
# The engine job runs build.sh --evm, which IS the merge gate the project relies on:
#   - wasm-opt -Oz --mvp-features (Fizzy-compatible MVP WASM)
#   - the MVP-opcode denylist check (wasm-objdump grep)
#   - the 1 MB Koinos max_object_size check
# Previously these all relied on a human remembering to run them (AUDIT `no-ci`).
#
# Toolchain comes from rust-toolchain.toml (pinned; rustup auto-installs it with
# its targets/components on first cargo invocation). Action SHAs are pinned
# (supply-chain hardening; see AUDIT build & supply chain notes).

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  engine:
    name: engine — build.sh --evm (MVP opcode + size gates) + host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install binaryen (wasm-opt) + wabt (wasm-strip, wasm-objdump)
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen wabt
      - name: Build engine with EVM feature (runs MVP-opcode + 1MB gates)
        working-directory: koinos-evm/engine
        run: ./build.sh --evm
      - name: Build engine without EVM feature (Phase-0 config still compiles)
        working-directory: koinos-evm/engine
        run: cargo build --release --locked
      - name: Engine host tests (parser golden vectors + rejection suite)
        working-directory: koinos-evm/engine
        run: cargo test --locked --features host-crypto --target x86_64-unknown-linux-gnu

  proxy:
    name: proxy — cargo build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build
        working-directory: koinos-evm/rpc
        run: cargo build --locked
      - name: Test
        working-directory: koinos-evm/rpc
        run: cargo test --locked

  lint:
    name: lint — cargo fmt --check + clippy -D warnings (both crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Proxy fmt
        working-directory: koinos-evm/rpc
        run: cargo fmt --check
      - name: Proxy clippy
        working-directory: koinos-evm/rpc
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Engine fmt
        working-directory: koinos-evm/engine
        run: cargo fmt --check
      - name: Engine clippy (evm feature, wasm target via .cargo config)
        working-directory: koinos-evm/engine
        run: cargo clippy --release --locked --features evm -- -D warnings
      - name: Engine clippy (host-crypto feature, host target)
        working-directory: koinos-evm/engine
        run: cargo clippy --locked --features host-crypto --target x86_64-unknown-linux-gnu -- -D warnings
